# Termux artifact overrides: point a JLL at the library the system already ships, so Pkg
# neither downloads the glibc artifact nor tries to load it (it cannot: libm.so.6).
#
# Keyed by the JLL's uuid + the artifact name - the *stable* form, which survives the JLL
# being updated.  It needs the patched Pkg that julia-termux ships (docs/14): without it Pkg
# loses the uuid on the download path and fetches the artifact anyway.
#
# Generated by tools/classify-jll.jl from tools/jlls-sweep.txt (2026-10-11) and validated
# with tools/validate-overrides.jl on the device.  See docs/15 for the map and docs/14 for
# the classification rule.
#
# Not here on purpose: the JLLs whose system build exports less API (FFTW, Fontconfig,
# Arpack - they would need an artifact or a shim), the ones blocked by a missing program
# (JpegTurbo, Expat, XZ), and the stdlib JLLs, which upstream already resolves this way.

# FFTW: not the system's build.  Termux's fftw has upstream's split threads layout and no
# NEON codelets, so this port builds the artifact itself (release fftw-bionic, docs/14 14.1).
[f5851436-0d7a-5f13-b9de-f02708fd171a]
FFTW = "/data/data/com.termux/files/home/.local/opt/fftw-bionic"

