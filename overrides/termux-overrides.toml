# Termux artifact overrides: point a JLL at the library the system already ships, so Pkg
# neither downloads the glibc artifact nor tries to load it (it cannot: libm.so.6).
#
# Keyed by the JLL's uuid + the artifact name - the *stable* form, which survives the JLL
# being updated.  It needs the patched Pkg that julia-termux ships (docs/14): without it Pkg
# loses the uuid on the download path and fetches the artifact anyway.
#
# Generated by tools/classify-jll.jl from tools/jlls-closure.txt and applied to the depot;
# validated with tools/validate-overrides.jl.  See docs/15 for the map, docs/14 for the rule,
# tools/jlls-accepted-gaps.txt for the gaps taken on purpose (each with its evidence) and
# tools/jlls-built-artifacts.txt for the three JLLs whose override points at an artifact this
# port built rather than at the system.
#
# Some entries need a name the system does not ship: overrides/aliases.sh creates them, and it
# is part of applying this file (measured: without libpng16.so.16 and libfribidi.so.0 the JLLs
# report override-needs-alias).

